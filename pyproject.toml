[project]
name = "diskmap"
version = "0.1.0"
description = "See what's using your disk and build a cleanup script."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
diskmap = "diskmap.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["diskmap"]

[tool.setuptools.package-data]
diskmap = ["static/*"]
