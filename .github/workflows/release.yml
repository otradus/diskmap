# Builds the standalone apps. Push a tag like v0.1.0 to publish a GitHub Release,
# or run it by hand (Actions → Build apps → Run workflow) to just get the files.
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            artifact: diskmap-macos-arm64.zip
          - os: windows-latest
            artifact: diskmap-windows-x64.exe
          - os: ubuntu-22.04      # older glibc, so the AppImage runs on more distros
            artifact: diskmap-linux-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install -r packaging/requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm packaging/diskmap.spec

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/diskmap.app "dist/${{ matrix.artifact }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/diskmap.exe "dist/${{ matrix.artifact }}"

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          packaging/build_appimage.sh ./appimagetool

      - name: Smoke test (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/scanme/project/node_modules"
          echo '{}' > "$RUNNER_TEMP/scanme/project/package.json"
          head -c 3000000 /dev/urandom > "$RUNNER_TEMP/scanme/project/node_modules/blob"
          APPIMAGE_EXTRACT_AND_RUN=1 BROWSER=true DISKMAP_ROOT="$RUNNER_TEMP/scanme" \
            "dist/${{ matrix.artifact }}" > app.log 2>&1 &
          APP_PID=$!
          for i in $(seq 60); do
            curl -sf http://127.0.0.1:8765/api/status | grep -q '"state":"done"' && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/api/status | grep -q '"state":"done"'
          curl -sf http://127.0.0.1:8765/ | grep -q '<title>Diskmap</title>'
          curl -sf -X POST -H 'X-Diskmap: 1' http://127.0.0.1:8765/api/quit
          for i in $(seq 10); do kill -0 "$APP_PID" 2>/dev/null || break; sleep 1; done
          if kill -0 "$APP_PID" 2>/dev/null; then echo "app did not quit"; cat app.log; exit 1; fi
          echo "AppImage OK"; cat app.log

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "diskmap $GITHUB_REF_NAME" --generate-notes
